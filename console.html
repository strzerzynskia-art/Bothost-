    <section class="hero">

        <h1>🖥️ Console</h1>

        <p>
            Consulte les logs et l'activité de ton bot.
        </p>

    </section>

    <section class="console-card">

        <div class="console-header">

            <strong>BotHost Console</strong>

            <span class="status">

            </span>

        </div>

            <p>[INFO] Bot connecté.</p>
            <p>[INFO] En attente de commandes...</p>

        </div>

        <button data-action="clear-console">
            🗑️ Effacer la console
        </button>

    </section>
