<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter mon bot - BotHost</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">🤖 BotHost</div>

    <nav>
        <a href="index.html">🏠 Accueil</a>
        <a href="bot.html">🤖 Mon bot</a>
        <a href="add.html">➕ Ajouter mon bot</a>
        <a href="console.html">🖥️ Console</a>
        <a href="settings.html">⚙️ Paramètres</a>
    </nav>

</header>

<main>

    <section class="hero">

        <h1>➕ Ajouter mon bot</h1>

        <p>
            Configure ton bot Discord sur BotHost.
        </p>

    </section>

    <section class="bot-card">

        <h2>🤖 Informations du bot</h2>

        <div class="form-group">
            <label>Nom du bot</label>
            <input type="text" placeholder="Exemple : Lunex">
        </div>

        <div class="form-group">
            <label>Fichier principal</label>
            <input type="text" placeholder="Exemple : Bot.py">
        </div>

        <div class="form-group">
            <label>Version Python</label>
            <select>
                <option>Python 3.11</option>
                <option>Python 3.12</option>
                <option>Python 3.13</option>
            </select>
        </div>

        <button>
            ➕ Ajouter le bot
        </button>

    </section>

</main>

<footer>
    <p>© 2026 BotHost</p>
</footer>

</body>
