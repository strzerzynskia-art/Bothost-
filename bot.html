<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon bot - BotHost</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🤖 BotHost
    </div>

    <nav>
        <a href="index.html">🏠 Accueil</a>
        <a href="bot.html">🤖 Mon bot</a>
        <a href="ajouter.html">➕ Ajouter mon bot</a>
        <a href="console.html">🖥️ Console</a>
    </nav>

</header>

<main>

    <section class="hero">

        <h1>🤖 Mon bot</h1>

        <p>
            Voici les informations de ton bot Discord.
        </p>

    </section>

    <section class="bot-card">

        <div class="bot-header">

            <div>
                <h2 id="bot-name-display">🤖 Aucun bot ajouté</h2>
                <p>BotHost</p>
            </div>

            <span class="status" id="bot-status-display">
                ⚪ Aucun bot configuré
            </span>

        </div>

        <div class="bot-info">

            <div>
                <span>État</span>
                <strong id="bot-state-display">Non configuré</strong>
            </div>

            <div>
                <span>Fichier principal</span>
                <strong id="bot-file-display">—</strong>
            </div>

            <div>
                <span>Version Python</span>
                <strong id="bot-python-display">—</strong>
            </div>

            <div>
                <span>ID de l'application</span>
                <strong id="bot-id-display">—</strong>
            </div>

            <div>
                <span>Uptime</span>
                <strong>Actif</strong>
            </div>

            <div>
                <span>Hébergement</span>
                <strong>BotHost</strong>
            </div>

        </div>

        <div class="buttons">

            <button data-action="start">
                ▶️ Démarrer
            </button>

            <button data-action="restart">
                🔄 Redémarrer
            </button>

            <button data-action="stop">
                🛑 Arrêter
            </button>

        </div>

    </section>

</main>

<footer>

    <p>
        © 2026 BotHost
    </p>

</footer>

<script src="script.js"></script>

</body>

                    </html>
