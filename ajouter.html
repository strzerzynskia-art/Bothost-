<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter mon bot - BotHost</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🤖 BotHost
    </div>

    <nav>
        <a href="index.html">🏠 Accueil</a>
        <a href="bot.html">🤖 Mon bot</a>
        <a href="ajouter.html">➕ Ajouter mon bot</a>
        <a href="console.html">🖥️ Console</a>
    </nav>

</header>


<main>

    <section class="hero">

        <h1>➕ Ajouter mon bot</h1>

        <p>
            Configure ton bot Discord sur BotHost.
        </p>

    </section>


    <section class="bot-card">

        <h2>🤖 Informations du bot</h2>


        <div class="form-group">

            <label for="bot-name">
                Nom du bot
            </label>

            <input
                type="text"
                id="bot-name"
                placeholder="Exemple : Lunex"
            >

        </div>


        <div class="form-group">

            <label for="bot-file">
                Fichier principal
            </label>

            <input
                type="text"
                id="bot-file"
                placeholder="Exemple : Bot.py"
                value="Bot.py"
            >

        </div>


        <div class="form-group">

            <label for="python-version">
                Version Python
            </label>

            <select id="python-version">

                <option value="3.11">
                    Python 3.11
                </option>

                <option value="3.12">
                    Python 3.12
                </option>

                <option value="3.13">
                    Python 3.13
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="bot-id">
                ID de l'application Discord
            </label>

            <input
                type="text"
                id="bot-id"
                placeholder="Exemple : 123456789012345678"
            >

        </div>


        <button
            type="button"
            data-action="add-bot"
            class="main-button"
        >
            ➕ Ajouter le bot
        </button>


    </section>

</main>


<footer>

    <p>
        © 2026 BotHost — Ton hébergeur personnel
    </p>

</footer>


<script src="script.js"></script>

</body>

            </html>
